<!doctype html>
<html lang="en-IN" data-theme="saki">
<head>
  <meta charset="utf-8">
  <title>Water Softeners &amp; Filters in Chennai | Saki Technologies</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F4FAFC">
  <meta name="format-detection" content="telephone=no">
  <!-- Apply the saved theme before first paint (no flash). Keep this tiny and inline. -->
  <script>
    (function () {
      try {
        var d = document.documentElement, t = localStorage.getItem('smp-theme');
        if (t && /^[a-z-]{2,20}$/.test(t)) d.setAttribute('data-theme', t);
        var v = JSON.parse(localStorage.getItem('smp-theme-vars') || 'null');
        if (v) for (var k in v) if (/^--color-[a-z-]+$/.test(k) && /^#[0-9a-f]{6}$/i.test(v[k])) d.style.setProperty(k, v[k]);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Montserrat:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/saki-icon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="images/saki-icon.png">
</head>
<body>
  <app-root></app-root>
  <noscript><p style="padding:1rem;text-align:center">This site works best with JavaScript enabled, but all content is available without it.</p></noscript>
</body>
</html>
